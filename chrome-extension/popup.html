<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkdump Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Link Dump</h1>
      <p class="subtitle">Save to your board</p>
    </header>

    <section class="board-section">
      <label for="boardUrl">Board URL</label>
      <div class="input-row">
        <input 
          type="text" 
          id="boardUrl" 
          placeholder="linkdump.connie.surf/abc12 or just abc12"
          spellcheck="false"
        >
        <button id="clearBoard" class="icon-btn" title="Clear saved board">×</button>
      </div>
      <p class="hint" id="boardStatus">No board connected</p>
    </section>

    <section class="actions-section">
      
      <div class="divider">
      </div>
   <button id="savePageBtn" class="btn" disabled>
        <span class="icon">🔗</span>
        Save Current Page
      </button>
    </br>
      <label for="textInput">Or save text, link, or image</label>
      <textarea 
        id="textInput" 
        placeholder="Paste text, URL, or an image..."
        rows="3"
      ></textarea>
      <div id="imagePreview" class="image-preview hidden">
        <img id="previewImg" src="" alt="Preview">
        <button id="clearImage" class="clear-image-btn" title="Remove image">×</button>
      </div>
      <button id="saveTextBtn" class="btn" disabled>
        Save
      </button>
    </section>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="dist/popup.js" type="module"></script>
</body>
</html>
