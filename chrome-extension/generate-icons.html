<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icons</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    h1 { margin-bottom: 20px; }
    .icon-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .icon-box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 16px;
      background: #5a8dee;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #4a7dde;
    }
    p { color: #666; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Generate Extension Icons</h1>
  <p>Click each button to download the icon, then save to the <code>icons/</code> folder.</p>
  
  <div class="icon-container">
    <div class="icon-box">
      <canvas id="canvas16" width="16" height="16"></canvas>
      <br>
      <button onclick="download(16)">Download icon16.png</button>
    </div>
    <div class="icon-box">
      <canvas id="canvas48" width="48" height="48"></canvas>
      <br>
      <button onclick="download(48)">Download icon48.png</button>
    </div>
    <div class="icon-box">
      <canvas id="canvas128" width="128" height="128"></canvas>
      <br>
      <button onclick="download(128)">Download icon128.png</button>
    </div>
  </div>

  <script>
    // Draw a simple "L" icon for Linkdump
    function drawIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.15);
      ctx.fill();
      
      // "L" letter
      ctx.fillStyle = '#5a8dee';
      const padding = size * 0.2;
      const strokeWidth = size * 0.18;
      
      // Vertical bar of L
      ctx.fillRect(padding, padding, strokeWidth, size - padding * 2);
      
      // Horizontal bar of L
      ctx.fillRect(padding, size - padding - strokeWidth, size - padding * 2, strokeWidth);
    }
    
    function download(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    // Draw all icons on load
    [16, 48, 128].forEach(drawIcon);
  </script>
</body>
</html>
