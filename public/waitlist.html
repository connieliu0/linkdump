<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link Dump Waitlist</title>
  <style>
      @import url('https://fonts.googleapis.com/css2?family=Mansalva&family=Schoolbell&display=swap');
    /* Font import */
    @font-face {
    font-family: 'Decompositionphase1';
    src: url('./assets/fonts/Decompositionphase1.woff2') format('woff2'),
        url('./assets/fonts/Decompositionphase1.woff') format('woff'),
        url('./assets/fonts/Decompositionphase1.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

    /* Page reset */
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    /* Container to hold video and content */
    .hero {
      position: relative;
      height: 100vh; /* full screen section */
      overflow: hidden;
      background: #111 url('/output.jpg') center/cover no-repeat; /* instant fallback */
    }

    .video-container {
      position: relative;
      height: 100%;
      z-index: 1;
    }

    video {
      display: block;
      width: 100%;
    }

    /* Clear video - visible in center */
    .video-clear {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease-in-out;
      pointer-events: none;
      z-index: 1;
      mask-image: radial-gradient(
        ellipse at center,
        black 0%,
        black 30%,
        rgba(0, 0, 0, 0.7) 50%,
        rgba(0, 0, 0, 0.3) 70%,
        transparent 100%
      );
      -webkit-mask-image: radial-gradient(
        ellipse at center,
        black 0%,
        black 30%,
        rgba(0, 0, 0, 0.7) 50%,
        rgba(0, 0, 0, 0.3) 70%,
        transparent 100%
      );
    }

    /* Blurred video - visible around edges */
    .video-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease-in-out;
      pointer-events: none;
      z-index: 1;
      filter: blur(20px);
      mask-image: radial-gradient(
        ellipse at center,
        transparent 0%,
        rgba(0, 0, 0, 0.3) 30%,
        rgba(0, 0, 0, 0.7) 50%,
        black 70%,
        black 100%
      );
      -webkit-mask-image: radial-gradient(
        ellipse at center,
        transparent 0%,
        rgba(0, 0, 0, 0.3) 30%,
        rgba(0, 0, 0, 0.7) 50%,
        black 70%,
        black 100%
      );
    }
    .group{
      flex-direction: row;
      display: flex;
    }
    /* Shadow overlay */
    .video-container::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      pointer-events: none;
      /* z-index: 5; */
    }

    /* Vignette overlay for darker edges, brighter center */
    .video-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        ellipse at center,
        transparent 0%,
        transparent 40%,
        rgba(0, 0, 0, 0.2) 70%,
        rgba(0, 0, 0, 0.6) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .hero.ready .video-clear { opacity: 1; }
    .hero.ready .video-blur { opacity: 1; }
    
    /* Crossfade effect during transitions */
    .video-clear.transitioning { opacity: 0.3; }
    .video-blur.transitioning { opacity: 0.3; }

    /* Content on top of the video */
    .content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      justify-content: center;
      text-align: center;
      backdrop-filter: saturate(120%);
      pointer-events: none;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2rem;
      height: 100vh;
      align-items: center;
      justify-items: center;
    
    }
    .card {
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      margin: 0.5rem;
      pointer-events: auto;
      height: 100px;
      width: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: left;
      border: 1px solid white;
      mix-blend-mode: multiply;
      opacity: 0;
      transform: translateY(-20px) rotate(0deg);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    /* Card drop animation */
    .card.drop-animation {
      opacity: 1;
      transform: translateY(0) rotate(var(--random-rotation, 0deg));
    }
    
    /* Signup drop animation */
    .signup.drop-animation {
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }

    /* Remove CSS-based delays - we'll handle timing in JavaScript */
    .card h2 {
      font-size: 2.5rem;
      margin: 0 0 .5rem;
      font-family: 'Decompositionphase1';
      color: white;
      font-weight: 400;
    }
    .card p {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      opacity: .9;
      font-family: "Schoolbell", cursive;
      color: white;
      margin: 0;
      mix-blend-mode: exclusion;
    }
   
    .top-left {
      grid-column: 1;
      grid-row: 1;
      justify-self: start;
      align-self: start;
      margin-left: 1rem;
      margin-top: 1rem;

    }
    .top-right {
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
      align-self: start;
      margin-right: 1rem;
      margin-top: 1rem;
      text-align: right;

    }
    .bottom-left {
      grid-column: 1;
      grid-row: 2;
      justify-self: start;
      align-self: end;
      margin-left: 1rem;
      margin-bottom: 1rem;
      text-align: left;
    }
    .bottom-right {
      grid-column: 3;
      grid-row: 2;
      justify-self: end;
      align-self: end;
      margin-right: 1rem;
      margin-bottom: 1rem;
      text-align: right;

    }
    .signup {
      grid-column: 2;
      grid-row: 1 / 3;
      justify-self: center;
      align-self: center;
      z-index: 100;
      position: relative;
      background-color: rgba(255, 255, 255, 0.5);
      opacity: 0;
      transform: translateY(-20px) rotate(0deg);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    /* Hide mobile elements on desktop */
    .mobile-descriptions {
      display: none;
    }

    .signup-form {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      z-index: 101;
      position: relative;
      margin-bottom: 0;

    }
    .signup p{
      color: #645a5a;
      font-family: "Schoolbell", cursive;

    }
    .signup-form input {
      padding: 0.75rem;
      border: white;
      background: rgba(242, 242, 242, 0.5);
      color: white;
      backdrop-filter: blur(10px);
      font-size: 1rem;
      outline: none;
      pointer-events: auto;
      z-index: 10;
      border: solid 1px white;
    }
    .signup-form input::placeholder {
      color: #645a5a94;
      font-family: "Schoolbell", cursive;
      font-size: 1rem;
    }
    .signup-form input:focus {
      border-color: white;
      background: rgba(73, 73, 73, 0.6);
      color: white;
    }
    .signup-form button {
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0);
      color: #645a5a;
      backdrop-filter: blur(10px);
      cursor: pointer;
      font-family: "Schoolbell", cursive;
      z-index: 102;
      position: relative;
      pointer-events: auto;
    }
    .signup-form button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .confirmation-message {
      margin-top: 1rem;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #645a5a;
      text-align: center;
      font-family: "Schoolbell", cursive;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Respect user's reduced motion preference: hide video and just use the poster/fallback */
    @media (prefers-reduced-motion: reduce) {
      #bgvideo { display: none; }
    }


    /* Mobile responsive design */
    @media (max-width: 768px) {
      .content {
        display: flex !important;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        height: 100vh;
      }
      
      /* Show link dump cards on mobile - at the top */
      .top-left {
        display: flex !important;
        justify-content: center;
        align-items: center;
        width: 100%;
        grid-column: unset;
        grid-row: unset;
        justify-self: center;
        align-self: center;
      }
      
      /* Signup form in the middle */
      .signup {
        position: static;
        margin: 0;
        grid-column: unset;
        grid-row: unset;
      }
      
      /* Mobile descriptions at the bottom */
      .mobile-descriptions {
        display: flex !important;
        flex-direction: column;
        gap:0.5rem;
        margin-bottom: 2rem;
      }
      
      .mobile-descriptions p {
        font-size: 1rem;
        font-family: "Schoolbell", cursive;
        color: white;
        opacity: 0.9;
        margin:0;
      }
      
      /* Hide other cards on mobile */
      .top-right,
      .bottom-left,
      .bottom-right {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <div class="video-container">
      <!-- Original clear video -->
      <video
        id="bgvideo"
        class="video-clear"
        autoplay
        muted
        playsinline
        preload="metadata"
      >
        <!-- Video sources will be dynamically set by JavaScript -->
      </video>
      
      <!-- Blurred copy of video -->
      <video
        id="bgvideo-blur"
        class="video-blur"
        autoplay
        muted
        playsinline
        preload="metadata"
      >
        <!-- Video sources will be dynamically set by JavaScript -->
      </video>
    </div>

    <div class="content">
      <!-- Top Left: Link Dump Cards -->
      <div class="top-left">
        <div style="display: flex; gap: -40px;">
          <div class="card">
            <h2>link</h2>
          </div>
          <div class="card" style="margin-left: -20px;">
            <h2>dump</h2>
          </div>
        </div>
      </div>
      
      <!-- Top Right: Import Links Card -->
      <div class="top-right">
        <div class="card">
          <p>paste links or import from are.na</p>
        </div>
      </div>
      
      <!-- Bottom Left: Organize Card -->
      <div class="bottom-left">
        <div class="card">
          <p>organize on an ephemeral canvas</p>
        </div>
      </div>
      
      <!-- Bottom Right: Until it Disappears Card -->
      <div class="bottom-right">
        <div class="card">
          <p>until it disappears</p>
        </div>
      </div>
      
      <!-- Center: Signup Form -->
      <div class="signup">
        <p>get an email when it's launched</p>
        <form id="submitForm" class="signup-form">
          <input type="email" id="emailInput" placeholder="Enter your email" required />
          <button type="submit">Submit</button>
        </form>
        <div id="confirmationMessage" class="confirmation-message" style="display: none;">
          Submission confirmed!
        </div>
      </div>
      
      <!-- Mobile Descriptions (hidden on desktop) -->
      <div class="mobile-descriptions">
        <p>import links from are.na</p>
        <p>organize on an ephemeral canvas</p>
        <p>until it disappears</p>
      </div>
    </div>
  </section>

  <script>
    (function () {
      const hero = document.getElementById('hero');
      const vid  = document.getElementById('bgvideo');
      const vidBlur = document.getElementById('bgvideo-blur');
      
      // Card drop animation function
      function animateCards() {
        // Get all cards in the order they should appear
        const topLeftCards = document.querySelectorAll('.top-left .card');
        const topRightCard = document.querySelector('.top-right .card');
        const bottomLeftCard = document.querySelector('.bottom-left .card');
        const bottomRightCard = document.querySelector('.bottom-right .card');
        const signupCard = document.querySelector('.signup');
        
        // Flatten all cards into a single array for individual timing (excluding signup)
        const allCards = [
          ...topLeftCards,  // Both link dump cards
          topRightCard,
          bottomLeftCard,
          bottomRightCard
        ].filter(card => card); // Remove any null values
        
        // Animate the main cards first
        allCards.forEach((card, index) => {
          // Generate random rotation between -15 and 15 degrees
          const randomRotation = (Math.random() - 0.5) * 30;
          card.style.setProperty('--random-rotation', `${randomRotation}deg`);
          
          // Each card falls individually with 200ms between each
          setTimeout(() => {
            card.classList.add('drop-animation');
          }, index * 200 + 200); // Start after 200ms, then stagger by 200ms each
        });
        
        // Animate the signup card last (after all other cards)
        if (signupCard) {
          const signupDelay = allCards.length * 200 + 200 + 1000; // Wait for all cards + 1 second
          setTimeout(() => {
            signupCard.classList.add('drop-animation');
          }, signupDelay);
        }
      }
      
      // Trigger card animation when page loads
      window.addEventListener('load', () => {
        setTimeout(animateCards, 300); // Wait 300ms after page load
      });
      
      // Array of video files from the converted folder
      const videos = [
        'assets/output'
      ];
      
      let currentVideoIndex = 0;

      // Function to set video source and update poster
      function setVideoSource(videoBase) {
        // Clear both videos
        vid.innerHTML = '';
        vidBlur.innerHTML = '';
        
        // Add WebM source (preferred for better compression)
        const webmSource = document.createElement('source');
        webmSource.src = `${videoBase}.webm`;
        webmSource.type = 'video/webm';
        vid.appendChild(webmSource.cloneNode(true));
        vidBlur.appendChild(webmSource.cloneNode(true));
        
        // Add MP4 source (fallback)
        const mp4Source = document.createElement('source');
        mp4Source.src = `${videoBase}.mp4`;
        mp4Source.type = 'video/mp4';
        vid.appendChild(mp4Source.cloneNode(true));
        vidBlur.appendChild(mp4Source.cloneNode(true));
        
        // Update poster to match current video
        vid.poster = `${videoBase}.jpg`;
        vidBlur.poster = `${videoBase}.jpg`;
        hero.style.backgroundImage = `url('${videoBase}.jpg')`;
        
        // Ensure no looping
        vid.loop = false;
        vidBlur.loop = false;
        
        // Preload the video for smoother transitions
        vid.preload = 'auto';
        vidBlur.preload = 'auto';
        
        // Load the new videos
        vid.load();
        vidBlur.load();
      }

      // Simple function to play next video
      function playNextVideo() {
        console.log('Playing next video, current index:', currentVideoIndex);
        
        currentVideoIndex = (currentVideoIndex + 1) % videos.length;
        console.log('Next video index:', currentVideoIndex);
        
        setVideoSource(videos[currentVideoIndex]);
        
        // Wait for both videos to be ready before playing
        let readyCount = 0;
        const handleCanPlay = () => {
          readyCount++;
          if (readyCount === 2) {
            vid.play().catch(() => {
              console.log('Autoplay blocked for clear video:', videos[currentVideoIndex]);
            });
            vidBlur.play().catch(() => {
              console.log('Autoplay blocked for blur video:', videos[currentVideoIndex]);
            });
          }
        };
        
        vid.addEventListener('canplay', handleCanPlay, { once: true });
        vidBlur.addEventListener('canplay', handleCanPlay, { once: true });
      }

      // Initialize with first video
      setVideoSource(videos[0]);
      
      // Fade in once both videos can play (avoids a flash of black frame)
      let initReadyCount = 0;
      const handleInitCanPlay = () => {
        initReadyCount++;
        if (initReadyCount === 2) {
          hero.classList.add('ready');
          
          // Start both videos
          vid.play().catch(() => {
            console.log('Initial autoplay blocked for clear video');
          });
          vidBlur.play().catch(() => {
            console.log('Initial autoplay blocked for blur video');
          });
        }
      };
      
      vid.addEventListener('canplay', handleInitCanPlay, { once: true });
      vidBlur.addEventListener('canplay', handleInitCanPlay, { once: true });
      
      // Listen for when ANY video ends to play the next one
      vid.addEventListener('ended', () => {
        console.log('Video ended, moving to next');
        playNextVideo();
      });

      // Pause the background videos when offscreen (battery-friendly)
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { 
            vid.play().catch(()=>{}); 
            vidBlur.play().catch(()=>{}); 
          } else { 
            vid.pause(); 
            vidBlur.pause(); 
            if (videoTimer) {
              clearTimeout(videoTimer);
            }
          }
        });
      }, { threshold: 0.01 });
      io.observe(hero);
    })();

    // Email signup form submission
    document.getElementById('submitForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = document.getElementById('emailInput').value;
      var button = document.querySelector('#submitForm button');
      var confirmationMessage = document.getElementById('confirmationMessage');
      
      // Show loading state
      button.textContent = 'Submitting...';
      button.disabled = true;
      
      // Try different approaches for Google Apps Script
      const formData = new FormData();
      formData.append('email', email);
      
      fetch('https://script.google.com/macros/s/AKfycby4RsYH7iCE-3OgohinJzwqTWrC3CK4S8OZePzd8VfxjC8Eu0m0sdXAFCyr3p6pLbjZ0w/exec', {
        method: 'POST',
        body: formData
      }).then(() => {
        // Show success message (with no-cors mode, we assume success)
        confirmationMessage.style.display = 'block';
        document.getElementById('emailInput').value = '';
        
        // Reset button
        button.textContent = 'Submit';
        button.disabled = false;
        
        // Hide confirmation message after 5 seconds
        setTimeout(() => {
          confirmationMessage.style.display = 'none';
        }, 5000);
        
      }).catch(error => {
        console.error('Error:', error);
        
        // Even if there's an error, show success since the request was sent
        confirmationMessage.style.display = 'block';
        document.getElementById('emailInput').value = '';
        
        // Reset button
        button.textContent = 'Submit';
        button.disabled = false;
        
        // Hide confirmation message after 5 seconds
        setTimeout(() => {
          confirmationMessage.style.display = 'none';
        }, 5000);
      });
    });
  </script>
</body>
</html>
